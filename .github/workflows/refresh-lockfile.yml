name: Refresh pnpm lockfile

on:
  push:
    branches:
      - 'feat/neon-data-layer'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/neon-data-layer
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          if [ -z "$(git status --short -- pnpm-lock.yaml)" ]; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): generate pnpm lockfile"
          git push origin HEAD:feat/neon-data-layer
